server {
    listen 80;
    server_name backend.farajayangutv.co.tz;

    # Logging configuration
    access_log /app/logs/nginx_access.log;
    error_log /app/logs/nginx_error.log warn;

    # ===== Security headers =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /media/ {
        alias /app/media/;
    }

    location /socket/ {
        proxy_pass http://0.0.0.0:8000/socket/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
    
    location / {
        proxy_pass http://0.0.0.0:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always tell Django the original scheme is HTTPS (handled by outer proxy/CDN)
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 5G;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}