version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farajayangutv}
      POSTGRES_USER: ${POSTGRES_USER:-farajayangutv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farajayangutv_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farajayangutv -d farajayangutv']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Channels and Celery
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Django core server (development mode)
  core:
    build: .
    command: >
      sh -c "python3.12 manage.py migrate --noinput &&
             python3.12 manage.py runserver 0.0.0.0:8000"
    ports:
      - '8000:8000'
    volumes:
      - .:/app
    environment:
      # Core
      DEBUG: 'True'
      SECRET_KEY: 'dev-secret-key-change-in-production'
      BASE_URL: 'http://localhost:8000'
      BACKEND_URL: 'http://localhost:8000'

      # Database
      DATABASE_ENGINE: 'django.db.backends.postgresql'
      DATABASE_NAME: 'farajayangutv'
      DATABASE_USER: 'farajayangutv'
      DATABASE_PASSWORD: 'farajayangutv_secret'
      DATABASE_HOST: 'db'
      DATABASE_PORT: '5432'

      # Redis
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      REDIS_USER: ''
      REDIS_PASSWORD: ''

      # JWT
      JWT_ACCESS_TTL_MINUTES: '60'

      # Storage (use local filesystem for dev; set real R2 creds for cloud storage)
      R2_ACCESS_KEY_ID: 'test-access-key'
      R2_SECRET_ACCESS_KEY: 'test-secret-key'
      AWS_STORAGE_BUCKET_NAME: 'test-bucket'
      AWS_S3_ENDPOINT_URL: 'http://localhost:9000'
      AWS_S3_REGION_NAME: 'auto'

      # Azure Email (dummy for dev)
      AZURE_EMAIL_ENDPOINT: 'https://dummy.communication.azure.com'
      AZURE_EMAIL_KEY: 'dummy-key'
      NO_REPLY_SENDER_EMAIL: 'no-reply@example.com'

      # Firebase (dummy for dev)
      FIREBASE_PROJECT_ID: ''
      FIREBASE_PRIVATE_KEY_ID: ''
      FIREBASE_PRIVATE_KEY: ''
      FIREBASE_CLIENT_EMAIL: ''
      FIREBASE_CLIENT_ID: ''

      # Google OAuth (optional)
      GOOGLE_CLIENT_ID: ''

      # Sentry (optional)
      SENTRY_DSN: ''
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker for CPU-intensive video processing tasks
  # Uses prefork pool for FFmpeg-based HLS conversion
  # Concurrency=1 to avoid multiple FFmpeg processes competing for CPU
  celery_video_worker:
    build: .
    command: celery -A farajayangu_be.celery worker -l info -Q video_processing --pool=prefork --concurrency=1 --max-tasks-per-child=5 -n video_worker@%h
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - .:/app
    environment: &celery_env
      DEBUG: 'True'
      SECRET_KEY: 'dev-secret-key-change-in-production'
      BASE_URL: 'http://localhost:8000'
      BACKEND_URL: 'http://localhost:8000'
      DATABASE_ENGINE: 'django.db.backends.postgresql'
      DATABASE_NAME: 'farajayangutv'
      DATABASE_USER: 'farajayangutv'
      DATABASE_PASSWORD: 'farajayangutv_secret'
      DATABASE_HOST: 'db'
      DATABASE_PORT: '5432'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      REDIS_USER: ''
      REDIS_PASSWORD: ''
      JWT_ACCESS_TTL_MINUTES: '60'
      R2_ACCESS_KEY_ID: 'test-access-key'
      R2_SECRET_ACCESS_KEY: 'test-secret-key'
      AWS_STORAGE_BUCKET_NAME: 'test-bucket'
      AWS_S3_ENDPOINT_URL: 'http://localhost:9000'
      AWS_S3_REGION_NAME: 'auto'
      AZURE_EMAIL_ENDPOINT: 'https://dummy.communication.azure.com'
      AZURE_EMAIL_KEY: 'dummy-key'
      NO_REPLY_SENDER_EMAIL: 'no-reply@example.com'
      FIREBASE_PROJECT_ID: ''
      FIREBASE_PRIVATE_KEY_ID: ''
      FIREBASE_PRIVATE_KEY: ''
      FIREBASE_CLIENT_EMAIL: ''
      FIREBASE_CLIENT_ID: ''
      GOOGLE_CLIENT_ID: ''
      SENTRY_DSN: ''
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker for I/O-bound general tasks (notifications, cleanup, etc.)
  # Uses threads pool for better I/O concurrency
  celery_general_worker:
    build: .
    command: celery -A farajayangu_be.celery worker -l info -Q general,celery --pool=threads --concurrency=4 --max-tasks-per-child=50 -n general_worker@%h
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - .:/app
    environment: *celery_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat scheduler
  celery_beat:
    build: .
    command: celery -A farajayangu_be beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment: *celery_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_video_worker:
        condition: service_started
      celery_general_worker:
        condition: service_started

volumes:
  postgres_data:
