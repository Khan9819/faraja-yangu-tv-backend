<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ video.title }} — Faraja Yangu TV</title>
  <meta name="description" content="{{ description }}">

  <meta property="og:title" content="{{ video.title }} — Faraja Yangu TV">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:image:width" content="640">
  <meta property="og:image:height" content="360">
  <meta property="og:type" content="video">
  <meta property="og:url" content="{{ og_url }}">
  <meta property="og:site_name" content="Faraja Yangu TV">

  <meta name="twitter:card" content="player">
  <meta name="twitter:title" content="{{ video.title }} — Faraja Yangu TV">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ og_image }}">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      width: 100%;
    }
    .card img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .card h1 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #C9781F;
    }
    .card p {
      color: #999;
      font-size: 0.9rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #C9781F;
      color: #fff;
      padding: 14px 36px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #a86216; }
    .btn-secondary {
      display: inline-block;
      margin-top: 12px;
      color: #C9781F;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    {% if og_image %}
      <img src="{{ og_image }}" alt="{{ video.title }}">
    {% endif %}
    <h1>{{ video.title }}</h1>
    <p>{{ description }}</p>
    <a class="btn" href="{{ play_store_url }}">Fungua kwenye Faraja Yangu TV</a>
    <br>
    <a class="btn-secondary" href="{{ play_store_url }}">Pakua app kutoka Google Play</a>
  </div>
</body>
</html>
