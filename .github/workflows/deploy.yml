name: Deploy Backend to CapRover

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy tarball
        run: |
          tar -czf /tmp/captain-definition.tar.gz .
          echo "Tarball created: $(ls -lh /tmp/captain-definition.tar.gz)"

      - name: Deploy to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP_NAME }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
        run: |
          echo "Logging in..."
          TOKEN=$(curl -sS -X POST "$CAPROVER_URL/api/v2/login" \
            -H "Content-Type: application/json" \
            -d "{\"password\": \"$CAPROVER_PASSWORD\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['token'])")
          
          echo "Deploying..."
          curl -sS -X POST "$CAPROVER_URL/api/v2/apps/deploy" \
            -H "Authorization: Bearer $TOKEN" \
            -F "appName=$CAPROVER_APP" \
            -F "tarFile=@/tmp/captain-definition.tar.gz"
