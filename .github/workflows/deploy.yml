name: Deploy Backend to CapRover
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CapRover Build
        run: |
          curl -sS -X POST "${{ secrets.CAPROVER_WEBHOOK_URL }}" --max-time 30
          echo "✅ CapRover build triggered for Backend"
